# Supabase CLI project config — only here for the link-preview function.
#
# The rest of the backend is set up by pasting supabase/schema.sql into the
# dashboard's SQL editor; nothing else in this project needs the CLI.
#
#   supabase link --project-ref <your-ref>
#   supabase functions deploy og
#
# verify_jwt = false is the load-bearing line: Discord, Slack and Twitter
# fetch the URL with no Authorization header, and the default (true) would
# answer every one of them with a 401 instead of a preview card.

project_id = "particletoy"

[functions.og]
verify_jwt = false
