<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>particletoy — editor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <a class="brand" href="index.html" title="Back to the front page" style="text-decoration:none">particle<b>toy</b></a>
  <input id="fx-name" class="text-in fx-name" value="Untitled" title="Effect name">
  <select id="preset-select" class="select-in" title="Load a preset"></select>
  <div class="seg" id="pipeline-seg" title="Graphics pipeline">
    <button id="pipe-deferred" class="seg-btn active" type="button">PBR · Deferred</button>
    <button id="pipe-forward" class="seg-btn" type="button">PBR · Forward</button>
  </div>
  <select id="debug-select" class="select-in" title="G-buffer debug view (deferred)">
    <option value="0">View: Final</option>
    <option value="1">View: Albedo</option>
    <option value="2">View: Normals</option>
    <option value="3">View: Rough/Metal</option>
    <option value="4">View: Emissive</option>
    <option value="5">View: Depth</option>
  </select>
  <div class="flex-spacer"></div>
  <button id="btn-play" class="btn" type="button" title="Play/Pause (Space)">⏸</button>
  <button id="btn-restart" class="btn" type="button" title="Restart">⟲</button>
  <select id="speed-select" class="select-in" title="Time scale">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
  </select>
  <span class="topbar-sep"></span>
  <button id="btn-share" class="btn" type="button" title="Copy a shareable link (no account needed)">Share</button>
  <button id="btn-save" class="btn" type="button" title="Save to browser library">Save</button>
  <button id="btn-library" class="btn" type="button" title="Open browser library">Library</button>
  <button id="btn-export" class="btn" type="button" title="Download effect JSON">Export</button>
  <button id="btn-import" class="btn" type="button" title="Import effect JSON">Import</button>
  <button id="btn-publish" class="btn btn-accent" type="button" title="Publish to the community gallery">Publish</button>
  <button id="btn-help" class="btn btn-icon" type="button" title="Shader API help">?</button>
</header>

<div id="main">
  <div id="left">
    <div id="viewport">
      <canvas id="gl"></canvas>
      <div id="viewport-overlay">
        <span id="stats"></span>
        <button id="btn-cam-reset" class="btn btn-small" type="button" title="Reset camera">⌂ cam</button>
      </div>
      <div id="gl-error" class="hidden"></div>
    </div>
    <div id="inspector"></div>
  </div>
  <div id="splitter"></div>
  <div id="right">
    <div id="editor-toolbar"></div>
    <div id="editor-host"></div>
    <div id="editor-errors"></div>
  </div>
</div>

<div id="modal-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
